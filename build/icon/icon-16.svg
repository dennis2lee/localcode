<!--
  The 16px drawing.

  At this size a stroke is one or two pixels and a gap is either there or
  it is not. The one detail that has to survive is the doorway: without
  it the mark closes into a solid pentagon, which is the generic home
  glyph every toolbar already has. So the feet are shorter and the gap
  between them is wider than the drawing above, and the roof is flatter
  so it does not eat the walls.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect x="0" y="0" width="256" height="256" rx="48" fill="#7f97dc"/>
  <g transform="translate(20 38) scale(9.2)"
     fill="none" stroke="#0f1011" stroke-width="3.4"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.4 11.4 L12 4.6 L21.6 11.4"/>
    <path d="M5.2 13.2 V19 H8.6"/>
    <path d="M18.8 13.2 V19 H15.4"/>
  </g>
</svg>
