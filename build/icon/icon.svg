<!--
  LocalCode's application icon: a brick whose face is a circuit board.

  Drawn as a bright blue brick with the traces cut *out* of it in the
  background colour, rather than a dark brick outlined in blue. An icon
  sits on a taskbar and a desktop whose colours we do not control, and a
  dark-on-dark shape disappears into both. The saturated body carries the
  silhouette; the traces read as detail inside it.

  Colours are the app's own accent, ok and background values from
  style.css, so the icon and the window it opens look like the same
  product.

  See icon-small.svg for the 16/32px variant — this one's detail turns to
  mud below about 48px, which is why there are two.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Studs. Drawn first so the body overlaps their lower half and they
       read as attached to it rather than sitting on top of it. -->
  <g fill="#58a6ff">
    <rect x="52"  y="34" width="42" height="34" rx="10"/>
    <rect x="107" y="34" width="42" height="34" rx="10"/>
    <rect x="162" y="34" width="42" height="34" rx="10"/>
  </g>

  <!-- Brick body. -->
  <rect x="34" y="58" width="188" height="146" rx="20" fill="#1f6feb"/>

  <!-- Circuit traces, cut in the background colour. Right angles only,
       with the corners left sharp: a PCB trace turns at 90 degrees, and
       rounding them here made it read as plumbing. -->
  <g stroke="#0d1117" stroke-width="11" fill="none" stroke-linecap="round">
    <path d="M62 176 L62 140 L104 140 L104 100"/>
    <path d="M104 176 L152 176 L152 122"/>
    <path d="M74 100 L74 118 L134 118"/>
    <path d="M152 90 L194 90 L194 152"/>
  </g>

  <!-- Nodes: the pads a trace terminates at. Green is the app's "ok"
       colour, and the only third colour here — enough to make the face
       read as a board rather than a maze. -->
  <g fill="#7ee787">
    <circle cx="104" cy="100" r="12"/>
    <circle cx="152" cy="122" r="12"/>
    <circle cx="62"  cy="176" r="12"/>
    <circle cx="194" cy="152" r="12"/>
  </g>
</svg>
