  <rect x="4" y="4" width="248" height="248" rx="52" fill="#7f97dc"/>
  <g transform="translate(22 32) scale(8.8)"
     fill="none" stroke="#0f1011" stroke-width="2.9"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.6 12 L12 4.2 L21.4 12"/>
    <path d="M5 13 V19.6 H9.4"/>
    <path d="M19 13 V19.6 H14.6"/>
  </g>
</svg>
