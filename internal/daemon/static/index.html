<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalCode</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- The window's own title bar, drawn by the page.
     Hidden everywhere except the desktop window on Windows, where the
     system frame has been taken away and these are the buttons that went
     with it. The strip left of them is a drag region the OS is told
     about: see internal/gui/chrome_windows.go. -->
<div id="window-bar" hidden>
  <span class="title" id="window-title">LocalCode</span>
  <div class="window-buttons">
    <button id="window-minimize" title="minimise">&#8722;</button>
    <button id="window-maximize" title="maximise / restore">&#9633;</button>
    <button id="window-close" class="close" title="close">&#10005;</button>
  </div>
</div>
<!-- The window's resize edges.
     WebView2 renders the page into a child window, so a press anywhere
     here belongs to that child and the top-level window's hit test never
     sees it — which is why these are drawn by the page and hand the press
     back to the window. Hidden with the title bar above. -->
<div id="window-edges" hidden>
  <div class="edge n" id="window-edge-top"></div>
  <div class="edge s" id="window-edge-bottom"></div>
  <div class="edge w" id="window-edge-left"></div>
  <div class="edge e" id="window-edge-right"></div>
  <div class="edge nw" id="window-edge-topleft"></div>
  <div class="edge ne" id="window-edge-topright"></div>
  <div class="edge sw" id="window-edge-bottomleft"></div>
  <div class="edge se" id="window-edge-bottomright"></div>
</div>
<header>
  <div class="left-group">
    <button class="panel-toggle" id="toggle-left" title="show/hide the session panel">&#9776;</button>
    <div class="brand">
      <h1>LocalCode</h1>
      <span class="version" id="app-version"></span>
    </div>
  </div>
  <div class="workspace-group">
    <button id="workspace-btn" title="click to change the workspace directory"></button>
    <button id="workspace-reveal-btn" class="icon-btn" title="open this folder in a file-manager window">&#128193;</button>
  </div>
  <div class="right">
    <select class="agent-select" id="agent-select" title="switch agent"></select>
    <span class="session-id" id="session-id">connecting…</span>
    <button class="panel-toggle" id="toggle-right" title="show/hide the tasks and MCP panel">&#9776;</button>
  </div>
</header>

<div id="workspace-modal">
  <div class="box">
    <h3>Workspace</h3>
    <div class="path-row">
      <input type="text" id="workspace-input" spellcheck="false" autocapitalize="off" autocorrect="off">
      <button id="workspace-browse">Browse&hellip;</button>
    </div>
    <p class="note" id="workspace-note">Changing this restarts relative-path resolution for every tool from the new directory. Refused while a turn is in progress.</p>
    <div class="actions">
      <button id="workspace-stop-busy" style="display:none">Stop those turns and switch</button>
      <button id="workspace-cancel">Cancel</button>
      <button id="workspace-save">Save</button>
    </div>
  </div>
</div>
<div id="task-modal">
  <div class="box">
    <h3 id="task-modal-title"></h3>
    <div id="task-modal-body"></div>
    <p class="note" id="task-modal-note"></p>
    <div class="actions">
      <button id="task-cancel" class="danger-btn">Stop this task</button>
      <button id="task-close">Close</button>
    </div>
  </div>
</div>
<main>
  <aside class="left" id="left-panel">
    <div class="side-section">
      <div class="side-header">
        <h2>Sessions</h2>
        <button class="icon-btn" id="new-session-btn" title="start a new session">+ new</button>
      </div>
      <div id="session-list"></div>
      <button class="icon-btn danger-btn" id="delete-all-sessions-btn" title="delete all sessions" style="width:100%">delete all sessions</button>
    </div>
  </aside>
  <div class="resizer" id="resize-left" title="drag to resize"></div>
  <div id="transcript-pane">
    <div id="transcript"></div>
    <!-- Shown only while the view is away from the bottom, so a turn that
         is still writing can be left running while something further up is
         read. -->
    <button id="jump-bottom" title="jump to the newest output" hidden>&darr; latest</button>
  </div>
  <div class="resizer" id="resize-right" title="drag to resize"></div>
  <aside id="right-panel">
    <div class="side-section">
      <h2>Background tasks</h2>
      <div id="tasks"></div>
    </div>
    <div class="side-section">
      <h2>MCP servers</h2>
      <div id="mcp-servers"></div>
    </div>
  </aside>
</main>
<footer>
  <textarea id="input" rows="1" placeholder="Type a message (Enter to send, /help for help, drag a file to attach)" autofocus></textarea>
  <button id="send">Send</button>
</footer>
<div id="prompt-status">
  <span class="comm-dot" id="comm-dot"></span>
  <span id="status-text"></span>
  <button class="pill stop" id="stop-btn" title="stop the running turn" hidden>&#9632; stop</button>
  <button class="pill" id="auto-delegate-btn" title="click to toggle auto-delegation"></button>
  <button class="pill" id="permission-status-btn" title="click to view or change permission settings"></button>
  <button class="pill" id="settings-btn" title="settings">&#9881; settings</button>
</div>

<!--
  Settings.

  One section per subject, each self-contained: adding a setting later is
  adding a block here and a line in settings.js, not a redesign.
-->
<div id="settings-modal">
  <div class="box">
    <h3>Settings</h3>

    <!--
      Updates.

      Two buttons rather than one, because the two things they do are not
      the same kind of thing: checking asks GitHub what the latest release
      is, and installing replaces the program you are using. Nothing here
      happens on opening the panel — a check is an outbound request that
      says which version this machine runs, and that is asked for.
    -->
    <h4 class="settings-section">Updates</h4>

    <div class="settings-field">
      <div class="field-row">
        <button id="update-check-btn">Check for updates</button>
        <button id="update-install-btn" hidden>Download and install</button>
      </div>
      <p class="note" id="update-note"></p>
    </div>

    <div class="close-row">
      <button id="settings-close">Close</button>
    </div>
  </div>
</div>

<div id="permission-settings-modal">
  <div class="box">
    <h3>Permissions</h3>
    <div class="skip-row">
      <input type="checkbox" id="skip-permissions-checkbox">
      <label for="skip-permissions-checkbox">Skip all permission prompts (dangerous — every tool call runs without asking; explicit deny rules still deny)</label>
    </div>
    <div id="permission-rules-list"></div>
    <div class="add-rule-row">
      <input type="text" name="tool" id="rule-tool-input" placeholder="tool (e.g. bash)">
      <input type="text" name="match" id="rule-match-input" placeholder="match pattern (e.g. npm *)">
      <select id="rule-decision-select">
        <option value="allow">allow</option>
        <option value="ask">ask</option>
        <option value="deny">deny</option>
      </select>
      <button id="rule-add-btn">Add</button>
    </div>
    <p class="note" id="permission-settings-note"></p>
    <div class="close-row"><button id="permission-settings-close">Close</button></div>
  </div>
</div>

<div id="auto-delegate-modal">
  <div class="box">
    <h3>Auto-delegation</h3>
    <div class="row">
      <input type="checkbox" id="delegate-enabled-checkbox">
      <label for="delegate-enabled-checkbox">Send matching prompts to a cheaper agent instead of this session's model</label>
    </div>
    <div style="margin-bottom:14px">
      <label class="field" for="delegate-agent-select">Answer them with</label>
      <select id="delegate-agent-select"></select>
    </div>
    <label class="field">Delegate a prompt when it matches any of these patterns</label>
    <div id="delegate-match-list"></div>
    <div class="add-match-row">
      <input type="text" id="delegate-match-input" placeholder="pattern, e.g. what is *">
      <button id="delegate-match-add">Add</button>
    </div>
    <p class="note" id="delegate-note"></p>
    <div class="close-row"><button id="delegate-close">Close</button></div>
  </div>
</div>

<div id="permission-modal">
  <div class="box">
    <h3>Permission request</h3>
    <p id="permission-text"></p>
    <div class="actions">
      <button class="deny" id="permission-deny">Deny</button>
      <button id="permission-allow-session" title="don't ask again this session">Allow for session</button>
      <button id="permission-allow-always" title="don't ask again — writes a rule to config.json">Always allow</button>
      <button id="permission-allow">Allow once</button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
