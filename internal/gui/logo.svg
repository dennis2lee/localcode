<!--
  LocalCode's application icon: a bracket pair that closes into a room.

  The two square brackets a programmer types every day, with their top
  serifs lifted into a roof and their feet turned back inward — so the
  same three strokes say code and say a place you own, and the doorway
  between the feet is left open.

  Drawn as a bright body with the mark cut out of it in the app's own
  ink, rather than a dark shape outlined in a colour. An icon sits on a
  taskbar and a desktop whose colours we do not control, and a dark on dark shape disappears into both: the saturated ground carries the
  silhouette and the mark reads as what is cut into it.

  What this replaces was a studded brick with a circuit-board face. Two
  things were wrong with it and neither was taste: the silhouette is a
  toy brick that belongs to somebody else, and its colours were taken
  from a stylesheet that had since moved on, so the icon and the window
  it opened were no longer the same product.

  Colours are the app's own interactive and ink values from style.css.
  See icon-small.svg and icon-16.svg: below about 48px this stroke
  weight closes the doorway, which is the one detail that has to survive.

  The shoulders are open here and closed in the small drawings, and that
  is deliberate: three separate strokes are what a bracket pair is, and
  the gap is what keeps this from being the solid pentagon every toolbar
  already has. Below about 48px the gap is smaller than a pixel, so the
  small drawings close it and let the silhouette do the work instead.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect x="8" y="8" width="240" height="240" rx="54" fill="#7f97dc"/>
  <g transform="translate(28 30) scale(8.3333)"
     fill="none" stroke="#0f1011" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.8 12 L12 4.6 L21.2 12"/>
    <path d="M5 13.1 V19.5 H9.2"/>
    <path d="M19 13.1 V19.5 H14.8"/>
  </g>
</svg>
