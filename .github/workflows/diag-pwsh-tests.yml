# Diagnostic, not part of the release: the local terminal tests, real
# PowerShell under a real pseudo console, on two Windows versions.
name: diag-pwsh-tests

on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/pwsh-feat
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Local terminal tests
        timeout-minutes: 15
        shell: bash
        run: go test ./internal/sshterm/ -run 'Real|Local|ShellName|StartingAgain|AStart|ARun.*Profile|AShellWithout|TheShellExiting|ClosingALocal|TheDefaultStart|AShellThatIsNotThere' -count=1 -v -timeout 10m 2>&1 | tee tests.log; exit ${PIPESTATUS[0]}
      - name: The same under the race detector
        timeout-minutes: 15
        shell: bash
        run: go test ./internal/sshterm/ -race -run 'Real|Local' -count=1 -timeout 10m
