# Diagnostic, not part of the release: measurements of the real console
# for the PowerShell panel's review, logged, not asserted.
name: diag-pwsh-probe

on:
  workflow_dispatch:
  push:
    branches: ['diag/**']
    paths: ['diag/pwsh-probe/**', '.github/workflows/diag-pwsh-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: feat/powershell-panel
          path: src
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: src/go.sum
      - name: Probe
        timeout-minutes: 15
        shell: bash
        run: |
          cp diag/pwsh-probe/*_test.go src/internal/sshterm/
          cd src && go test ./internal/sshterm/ -run 'Probe' -count=1 -v -timeout 10m 2>&1 | tee ../probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwsh-probe-${{ matrix.os }}
          path: probe.log
