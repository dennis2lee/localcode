# Diagnostic, not part of the release: does the zoom shortcut still zoom
# the page when the key carries no native key code?
name: diag-browser-keys

on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, browser: chrome }
          - { os: windows-latest, browser: edge }
          - { os: ubuntu-latest, browser: chrome }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Zoom shortcut, as sent today
        timeout-minutes: 6
        shell: pwsh
        run: |
          if ('${{ matrix.browser }}' -eq 'edge') { $env:LC_PROBE_BROWSER = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' }
          go test -count=1 -timeout 5m -run 'TestZZProbeRuntimeZoom' -v ./internal/browser/
      - name: Zoom shortcut, without the native key code
        if: always()
        timeout-minutes: 6
        shell: pwsh
        run: |
          if ('${{ matrix.browser }}' -eq 'edge') { $env:LC_PROBE_BROWSER = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' }
          $env:LC_PROBE_NO_NATIVE = '1'
          go test -count=1 -timeout 5m -run 'TestZZProbeRuntimeZoom' -v ./internal/browser/
