# Diagnostic, not part of the release: where a click the panel sends lands
# under a zoomed profile, a scaled display, and Ctrl+wheel, on Windows with
# Chrome and with Edge.
name: diag-browser-zoom

on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Probe
        timeout-minutes: 12
        shell: pwsh
        run: |
          if ('${{ matrix.browser }}' -eq 'edge') { $env:LC_PROBE_BROWSER = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' }
          "browser override: '$env:LC_PROBE_BROWSER'"
          go test -count=1 -timeout 10m -run 'TestZZProbe' -v ./internal/browser/
