# Builds the native-window (webview) build of localcode on Windows.
#
# This lives in CI, not the Makefile, on purpose: the GUI links a native
# WebView2 through CGo, which cannot be cross-compiled from the macOS box
# the pure-Go release artifacts are built on. A real Windows runner is the
# only place this binary can be produced and smoke-tested.
#
# The artifact it uploads is the bare localcode-gui.exe. Running it needs
# the WebView2 runtime, which ships with Windows 11 and recent Windows 10;
# older systems install it once from Microsoft's Evergreen bootstrapper.
# Bundling that into the MSI is a separate step, deliberately deferred
# until this build is confirmed green and testable on a real Windows box.
name: gui-windows

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/gui-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      # CGo needs a C compiler. The windows-latest image ships MinGW-w64;
      # print it so a failure here is obvious in the log rather than a
      # confusing linker error later.
      - name: Show C toolchain
        run: gcc --version

      # -H windowsgui makes this a GUI-subsystem binary: launched from cmd
      # or Explorer it opens its window and hands the shell prompt straight
      # back, instead of pinning the console for the window's whole
      # lifetime (and, from Explorer, flashing an empty console box).
      #
      # The trade-off is that a GUI-subsystem process has no console of its
      # own, so console-only subcommands (`version`, `mcp`, `login`) print
      # nowhere useful from this binary — those belong to the regular
      # console-subsystem localcode.exe, which ships in the same MSI.

      # Speech dictation links sherpa-onnx, and that module ships only
      # DLLs for Windows — no .a import libraries. webview_go, meanwhile,
      # adds "-static" to the Windows link, and ld in static mode refuses
      # to follow a DLL at all ("have you installed the static version of
      # the sherpa-onnx-c-api library?"). macOS never hits this because
      # that module ships .dylib files.
      #
      # An import library is itself an archive, so generating one from
      # each DLL satisfies -static while still loading the DLL at run
      # time. gendef reads the DLL's export table into a .def; dlltool
      # turns that into the archive ld wants. Both ship with MinGW-w64.
      #
      # The DLLs still have to sit beside the exe at run time — they are
      # uploaded with it below and installed by the MSI.
      - name: Build sherpa-onnx import libraries
        shell: bash
        run: |
          set -euo pipefail
          # Downloaded explicitly: this step runs before `go build`, so
          # nothing has fetched the module yet and its directory does not
          # exist.
          go mod download github.com/k2-fsa/sherpa-onnx-go-windows
          # `go list -m` rather than a hand-built path under GOMODCACHE, so
          # the version tracks go.mod instead of being pinned here twice.
          # It prints a native Windows path (backslashes), which bash reads
          # as escapes — cygpath converts it.
          lib="$(cygpath -u "$(go list -m -f '{{.Dir}}' github.com/k2-fsa/sherpa-onnx-go-windows)")/lib/x86_64-pc-windows-gnu"
          if [ ! -d "$lib" ]; then
            echo "sherpa-onnx windows lib dir not found: $lib" >&2
            exit 1
          fi
          mkdir -p implib
          cd implib
          for dll in sherpa-onnx-c-api onnxruntime sherpa-onnx-cxx-api; do
            cp "$lib/$dll.dll" .
            gendef "$dll.dll"
            dlltool -d "$dll.def" -D "$dll.dll" -l "lib$dll.a"
            test -s "lib$dll.a" || { echo "no import library produced for $dll" >&2; exit 1; }
          done
          ls -la

      - name: Build GUI (-tags gui, CGo)
        env:
          CGO_ENABLED: '1'
          # Puts the generated import libraries on the link path. The
          # sherpa module's own -L points at a directory holding only
          # DLLs, so ld falls through to this one for the archives.
          CGO_LDFLAGS: -L${{ github.workspace }}/implib
        run: go build -tags gui -ldflags "-s -w -H windowsgui" -o localcode-gui.exe ./cmd/localcode

      # The DLLs have to sit beside the exe for it to start at all, which
      # makes the smoke check below a real test of them too: a missing or
      # mismatched DLL shows up as the process failing to start.
      - name: Stage runtime DLLs beside the exe
        shell: bash
        run: cp implib/*.dll .

      # Proves the CGo binary actually links and runs on Windows. Because
      # the binary is GUI-subsystem, PowerShell does not wait for it and its
      # stdout goes nowhere — Start-Process -Wait is what makes the exit
      # code observable, so a link error or an instant crash still fails CI.
      # `version` exits immediately without opening a window or reading a
      # config, so this stays headless.
      - name: Smoke check
        run: |
          $p = Start-Process -FilePath ./localcode-gui.exe -ArgumentList 'version' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "localcode-gui.exe version exited $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: localcode-gui-windows-amd64
          path: |
            localcode-gui.exe
            sherpa-onnx-c-api.dll
            sherpa-onnx-cxx-api.dll
            onnxruntime.dll
          if-no-files-found: error
