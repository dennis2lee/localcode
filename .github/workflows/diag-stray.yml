# Measurement only: why a page a link opened behind is not listed on the
# macOS runner under the gate's load. Lives on diag/stray-tabs, never on
# main.
name: diag-stray

on:
  push:
    branches: ['diag/stray-tabs']

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    name: macos-gate-${{ matrix.n }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: which browser
        shell: bash
        run: |
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version || true
          sysctl -n hw.ncpu hw.memsize
      - name: the gate, with the browser manager telling what it does
        timeout-minutes: 30
        shell: bash
        env:
          LC_PROBE_LOG: '1'
        run: ./scripts/check.sh || true
