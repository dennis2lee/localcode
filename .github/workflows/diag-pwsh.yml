# Diagnostic, not part of the release: what a Windows pseudo console does
# with PowerShell's output and the marks the panel would rely on.
# Runs on pushes to diag/* branches only.
name: diag-pwsh

on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  conpty:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Build
        timeout-minutes: 8
        shell: bash
        run: go build -o conpty.exe ./diag/conpty
      - name: Windows PowerShell, no profile
        timeout-minutes: 3
        shell: pwsh
        run: ./conpty.exe -shell powershell.exe
      - name: Windows PowerShell, with profile
        timeout-minutes: 3
        shell: pwsh
        run: ./conpty.exe -shell powershell.exe -profile
      - name: PowerShell 7
        timeout-minutes: 3
        shell: pwsh
        run: ./conpty.exe -shell pwsh.exe
